info:
  name: Actualizar producto
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/products/{{productId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Notebook Bruno Pro",
        "description": "Producto actualizado desde Bruno",
        "price": 1499.99
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("actualiza el producto", function() {
          expect(res.status).to.equal(200);
          expect(res.body.name).to.equal("Notebook Bruno Pro");
          expect(res.body.price).to.equal(1499.99);
        });

settings:
  encodeUrl: true
