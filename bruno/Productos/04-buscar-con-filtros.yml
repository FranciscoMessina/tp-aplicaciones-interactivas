info:
  name: Buscar productos con filtros
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  params:
    - name: search
      value: Notebook
    - name: category
      value: "{{categoryId}}"
    - name: minPrice
      value: "1000"
    - name: maxPrice
      value: "2000"
    - name: sortBy
      value: relevance
    - name: sortOrder
      value: desc
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("busca y filtra productos", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array");
          expect(res.body.some((product) => product.id === bru.getVar("productId"))).to.equal(true);
        });

settings:
  encodeUrl: true
