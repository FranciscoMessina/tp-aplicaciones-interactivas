info:
  name: Crear producto
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/products"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Heladera",
        "category": "{{categoryId}}",
        "description": "Producto creado desde la coleccion de Bruno",
        "images": [
          "https://example.com/images/notebook-front.jpg",
          "https://example.com/images/notebook-back.jpg"
        ],
        "price": 1299.99
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setVar("productId", res.body.id);
        }
    - type: tests
      code: |-
        test("crea el producto", function() {
          expect(res.status).to.equal(201);
          expect(res.body.id).to.be.a("string");
          expect(res.body.category).to.equal(bru.getVar("categoryId"));
          expect(res.body.availableQuantity).to.equal(0);
          expect(res.body.isActive).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
