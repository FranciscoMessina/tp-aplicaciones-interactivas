info:
  name: Crear producto
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/products"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Notebook ASUS Vivobook 15 Core i5",
        "category": "COMPLETAR con el id de Computadoras, sale de Listar categorias",
        "description": "Notebook de 15,6\" Full HD con Intel Core i5 de 12.ª generación, 16GB de RAM y SSD de 512GB. Ideal para trabajo y estudio.",
        "images": [
          "https://picsum.photos/seed/asus-vivobook-15-main/800/600",
          "https://picsum.photos/seed/asus-vivobook-15-detail/800/600"
        ],
        "price": 949999,
        "availableQuantity": 8
      }
  auth: inherit

docs: |-
  Crea un producto.

  **Auth:** administrador. Usa el token guardado al iniciar sesión como admin.

  **Recibe**

  Body:
  - `name`
  - `category`: id de una categoría existente, sale de "Listar categorias".
  - `description`
  - `images`: array de URLs, al menos una.
  - `price`: número mayor o igual a 0.
  - `availableQuantity` (opcional, por defecto 0): stock. Con 0 el producto se muestra sin stock.
  - `isActive` (opcional, por defecto `true`): si se publica en el sitio.

  **Devuelve**

  - `201` con el producto (`id`, `name`, `category`, `description`, `images`, `price`, `availableQuantity`, `isActive`, `createdAt`, `updatedAt`). `category` viene como id.
  - `400` si algún campo es inválido; `error.fields` trae los mensajes por campo. También si la categoría no existe.
  - `401` si falta el token o está vencido.
  - `403` si el usuario no es administrador.

settings:
  encodeUrl: true
