info:
  name: Actualizar producto
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/products/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Id del producto, copiarlo de "Listar productos"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "price": 899999,
        "availableQuantity": 5
      }
  auth: inherit

docs: |-
  Modifica un producto. Solo cambian los campos que se mandan.

  **Auth:** administrador. Usa el token guardado al iniciar sesión como admin.

  **Recibe**

  - Param `id`: id del producto, sale de "Listar productos".
  - Body: cualquiera de los campos de "Crear producto", al menos uno.

  **Devuelve**

  - `200` con el producto actualizado. `category` viene como id.
  - `400` si algún campo es inválido; `error.fields` trae los mensajes por campo. También si la categoría no existe.
  - `401` si falta el token o está vencido.
  - `403` si el usuario no es administrador.
  - `404` si el producto no existe.

settings:
  encodeUrl: true
