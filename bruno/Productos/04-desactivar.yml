info:
  name: Desactivar producto
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/products/{{productId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("desactiva el producto", function() {
          expect(res.status).to.equal(200);
          expect(res.body.isActive).to.equal(false);
        });

settings:
  encodeUrl: true
