info:
  name: Obtener producto
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("obtiene el producto con su categoria", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.id).to.equal(bru.getVar("productId"));
          expect(res.body.data.category.id).to.equal(bru.getVar("categoryId"));
        });

settings:
  encodeUrl: true
