info:
  name: Listar productos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/products?search=notebook&sortBy=relevance&page=1&pageSize=20"
  params:
    - name: search
      value: "notebook"
      type: query
      description: Texto a buscar en nombre y descripcion (opcional)
    - name: sortBy
      value: "relevance"
      type: query
      description: publicationDate, price o relevance (relevance requiere search)
    - name: page
      value: "1"
      type: query
      description: Numero de pagina, desde 1
    - name: pageSize
      value: "20"
      type: query
      description: Productos por pagina, de 1 a 100
  auth: inherit

docs: |-
  Busca y lista productos, paginados. Sin filtros devuelve todos los activos, del más nuevo al más viejo.

  **Auth:** opcional. Si hay un token de administrador, cambia lo que devuelve (ver abajo).

  **Recibe**

  Query, todos opcionales:
  - `search`: texto a buscar en nombre y descripción. Tolera errores de tipeo.
  - `category`: id de una categoría, sale de "Listar categorias".
  - `minPrice` / `maxPrice`: rango de precio.
  - `sortBy`: `publicationDate` (por defecto), `price` o `relevance`. `relevance` requiere `search`.
  - `sortOrder`: `desc` (por defecto) o `asc`.
  - `page`: desde 1 (por defecto 1).
  - `pageSize`: de 1 a 100 (por defecto 20).
  - `includeInactive`: `true` para incluir los productos desactivados. Solo tiene efecto con un token de administrador; para cualquier otro se ignora.

  **Devuelve**

  - `200` con `data.items` (array de productos, cada uno con su `category` completa), `data.page`, `data.pageSize` y `data.total` (cantidad total de resultados, para calcular las páginas).
  - `400` si algún campo es inválido; `error.fields` trae los mensajes por campo.

settings:
  encodeUrl: true
