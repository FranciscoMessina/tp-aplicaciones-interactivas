info:
  name: Listar productos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/products?search=brun"
  params:
    - name: search
      value: brun
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("lista los productos", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.items).to.be.an("array");
          expect(res.body.data.total).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
