info:
  name: Listar productos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/products?search=notebook&sortBy=relevance&page=1&pageSize=20"
  params:
    - name: search
      value: "notebook"
      type: query
      description: Texto a buscar en nombre y descripcion (opcional)
    - name: sortBy
      value: "relevance"
      type: query
      description: publicationDate, price o relevance (relevance requiere search)
    - name: page
      value: "1"
      type: query
      description: Numero de pagina, desde 1
    - name: pageSize
      value: "20"
      type: query
      description: Productos por pagina, de 1 a 100
  auth: inherit

docs: |-
  Tambien acepta `category`, `minPrice`, `maxPrice`, `sortOrder` e
  `includeInactive` (este ultimo solo tiene efecto logueado como admin).

settings:
  encodeUrl: true
