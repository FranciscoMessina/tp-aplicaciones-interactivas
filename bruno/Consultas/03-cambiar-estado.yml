info:
  name: Cambiar estado de consulta
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/enquiries/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Id de la consulta, copiarlo de "Listar consultas"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "READ"
      }
  auth: inherit

docs: |-
  `status` puede ser `PENDING`, `READ` o `RESOLVED`.

settings:
  encodeUrl: true
