info:
  name: Listar consultas
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/enquiries?status=PENDING"
  params:
    - name: status
      value: "PENDING"
      type: query
      description: PENDING, READ o RESOLVED (opcional)
  auth: inherit

docs: |-
  `status` es opcional: `PENDING`, `READ` o `RESOLVED`. Sin el, lista todas.

settings:
  encodeUrl: true
