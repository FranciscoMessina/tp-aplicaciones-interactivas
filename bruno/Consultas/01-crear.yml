info:
  name: Crear consulta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/enquiries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Tomás Herrera",
        "email": "tomas.herrera@example.com",
        "phone": "+54 11 4444 2020",
        "subject": "Consulta por Nintendo Switch 2",
        "message": "Hola, ¿la Nintendo Switch 2 viene con algún juego incluido? ¿Tienen stock para retirar esta semana?"
      }
  auth:
    type: none

settings:
  encodeUrl: true
