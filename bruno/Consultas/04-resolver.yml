info:
  name: Resolver consulta
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/enquiries/{{enquiryId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "RESOLVED"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("avanza la consulta a RESOLVED", function() {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal("RESOLVED");
        });

settings:
  encodeUrl: true
