info:
  name: Solicitar recuperacion de contraseña
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/users/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "cliente@example.com"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
