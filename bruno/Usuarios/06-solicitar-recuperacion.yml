info:
  name: Solicitar recuperacion de contrasena
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/users/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{userEmail}}"
      }
  auth:
    type: none

runtime:
