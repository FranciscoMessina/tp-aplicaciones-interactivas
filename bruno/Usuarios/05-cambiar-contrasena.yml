info:
  name: Cambiar contrasena
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/me/password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{userPassword}}",
        "newPassword": "{{newUserPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("cambia la contrasena", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.message).to.equal("La contraseña se actualizó correctamente");
        });

settings:
  encodeUrl: true
