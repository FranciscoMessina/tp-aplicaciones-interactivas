info:
  name: Iniciar sesion como admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/users/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "Admin123!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", res.body.data.accessToken);
        }

docs: |-
  Inicia sesión con el administrador del seed y guarda el token en la variable `accessToken`. Hay que correrla antes de las requests de administración.

  **Auth:** no requiere.

  **Recibe**

  Body:
  - `email`
  - `password`

  **Devuelve**

  - `200` con `data.accessToken` (JWT) y `data.user` (`id`, `fullName`, `email`, `phone` y `role`).
  - `401` si el email o la contraseña son incorrectos.

settings:
  encodeUrl: true
