info:
  name: Iniciar sesion como admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/users/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "Admin123!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", res.body.data.accessToken);
        }

settings:
  encodeUrl: true
