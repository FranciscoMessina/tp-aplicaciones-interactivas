info:
  name: Iniciar sesion como admin
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/users/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", res.body.data.accessToken);
        }
    - type: tests
      code: |-
        test("inicia sesion con un administrador", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.user.role).to.equal("admin");
        });

settings:
  encodeUrl: true
