info:
  name: Crear administrador
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/users/admins"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Admin Bruno",
        "email": "admin.bruno.{{$timestamp}}@example.com",
        "phone": "+54 11 5555-0102",
        "password": "{{adminPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("crea un administrador sin devolver token", function() {
          expect(res.status).to.equal(201);
          expect(res.body.data.role).to.equal("admin");
          expect(res.body.data.accessToken).to.equal(undefined);
        });

settings:
  encodeUrl: true
