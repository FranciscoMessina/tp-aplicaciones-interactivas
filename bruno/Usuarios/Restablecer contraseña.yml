info:
  name: Restablecer contraseña
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/users/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "COMPLETAR con el token que escribe la consola del servidor",
        "password": "Customer123!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
