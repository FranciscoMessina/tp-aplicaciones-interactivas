info:
  name: Restablecer contraseña
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/users/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        // Completar con el token que devuelve el servidor, por ahora lo muestra en consola
        "token": "",
        "password": "Customer123!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Cambia la contraseña usando el token de recuperación. El body deja la contraseña del cliente del seed como estaba.

  **Auth:** no requiere.

  **Recibe**

  Body:
  - `token`: el que escribió la consola del servidor después de "Solicitar recuperacion de contraseña".
  - `password`: la contraseña nueva, mínimo 8 caracteres.

  **Devuelve**

  - `200` con `data.message`.
  - `400` si el token es inválido, ya se usó o venció.
