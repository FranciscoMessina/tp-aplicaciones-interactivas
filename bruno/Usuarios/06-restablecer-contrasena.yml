info:
  name: Restablecer contrasena
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/users/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{resetToken}}",
        "password": "{{newUserPassword}}"
      }

runtime:
  variables:
    - name: newUserPassword
      value: "12345678"
  scripts:
    - type: tests
      code: |-
        test("restablece la contrasena", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.message).to.equal("La contraseña se actualizó correctamente");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
