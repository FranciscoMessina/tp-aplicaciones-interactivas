info:
  name: Actualizar perfil
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/me"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Cliente Bruno Actualizado",
        "phone": "+54 11 5555-0199"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("actualiza el perfil", function() {
          expect(res.status).to.equal(200);
          expect(res.body.user.fullName).to.equal("Cliente Bruno Actualizado");
        });

settings:
  encodeUrl: true
