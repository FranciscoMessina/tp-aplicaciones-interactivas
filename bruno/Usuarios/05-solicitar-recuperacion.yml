info:
  name: Solicitar recuperacion de contrasena
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/users/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{userEmail}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.resetToken) {
          bru.setVar("resetToken", res.body.resetToken);
        }
    - type: tests
      code: |-
        test("genera instrucciones de recuperacion", function() {
          expect(res.status).to.equal(200);
          expect(res.body.message).to.be.a("string");
        });

settings:
  encodeUrl: true
