info:
  name: Actualizar categoria
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/categories/{{categoryId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "{{updatedCategoryName}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("updatedCategoryName", `Tecnologia Bruno Actualizada ${Date.now()}`);
    - type: tests
      code: |-
        test("actualiza una categoria", function() {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("categoryId"));
          expect(res.body.name).to.equal(bru.getVar("updatedCategoryName"));
        });

settings:
  encodeUrl: true
