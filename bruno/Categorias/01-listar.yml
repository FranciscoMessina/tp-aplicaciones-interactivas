info:
  name: Listar categorias
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/categories"
  auth:
    type: none

docs: |-
  Lista todas las categorías, ordenadas por nombre.

  **Auth:** no requiere.

  **Recibe**

  Nada.

  **Devuelve**

  - `200` con un array de categorías (`id`, `name`, `createdAt`, `updatedAt`).

settings:
  encodeUrl: true
