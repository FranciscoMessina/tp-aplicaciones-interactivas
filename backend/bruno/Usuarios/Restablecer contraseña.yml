info:
  name: Restablecer contraseña
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/users/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        // Completar con el token del enlace que llega por mail (o que muestra la consola)
        "token": "843b2efec9479d10496e9c32fd7bae8590e3308f02fee7ff787c6e72048bb5d6",
        "password": "Admin123!"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Cambia la contraseña usando el token de recuperación. El body deja la contraseña del administrador del seed como estaba. También activa las cuentas creadas por otro administrador, que reciben el mismo tipo de token en la invitación. Cierra las sesiones abiertas de la cuenta.

  **Auth:** no requiere.

  **Recibe**

  Body:
  - `token`: el del enlace que llega por mail después de "Solicitar recuperacion de contraseña" (sin SMTP configurado, lo escribe la consola del servidor).
  - `password`: la contraseña nueva, mínimo 8 caracteres y hasta 72 bytes.

  **Devuelve**

  - `200` con `data.message`.
  - `400` si el token es inválido, ya se usó o venció.
  - `429` después de 10 intentos en 15 minutos desde la misma IP.
