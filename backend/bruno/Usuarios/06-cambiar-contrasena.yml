info:
  name: Cambiar contrasena
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/api/users/me/password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "Customer123!",
        "newPassword": "Customer456!"
      }
  auth: inherit

docs: |-
  Cambia la contraseña del usuario logueado. Si se usa con el cliente del seed, después hay que iniciar sesión con la contraseña nueva.

  **Auth:** cualquier usuario logueado. Usa el token guardado al iniciar sesión.

  **Recibe**

  Body:
  - `currentPassword`: la contraseña actual.
  - `newPassword`: mínimo 8 caracteres.

  **Devuelve**

  - `200` con `data.message`.
  - `400` si `currentPassword` es incorrecta (en `error.fields.currentPassword`) o algún campo es inválido.
  - `401` si falta el token o está vencido.

settings:
  encodeUrl: true
