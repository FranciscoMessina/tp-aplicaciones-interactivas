info:
  name: Cerrar sesion
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/users/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 204) {
          bru.deleteVar("accessToken");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Cierra la sesión. Con JWT el servidor no guarda sesiones: solo valida el token, y quien lo descarta es el cliente. El token sigue valiendo hasta que vence.

  **Auth:** cualquier usuario logueado. Usa el token guardado al iniciar sesión.

  **Recibe**

  Nada.

  **Devuelve**

  - `204` sin cuerpo.
  - `401` si falta el token o está vencido.
