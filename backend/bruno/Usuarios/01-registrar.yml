info:
  name: Registrar usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/users/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "fullName": "Juan Pérez",
        "email": "juan.perez@example.com",
        "phone": "+54 11 4567 8901",
        "password": "JuanPerez123!"
      }
  auth:
    type: none

docs: |-
  Crea una cuenta de administrador del comercio. Es el único tipo de cuenta: los visitantes navegan y envían consultas sin registrarse.

  **Auth:** no requiere.

  **Recibe**

  Body:
  - `fullName`: nombre y apellido.
  - `email`: único en todo el sistema.
  - `phone`
  - `password`: mínimo 8 caracteres.

  **Devuelve**

  - `201` con `data.accessToken` (JWT) y `data.user` (`id`, `fullName`, `email`, `phone` y `role`).
  - `400` si algún campo es inválido; `error.fields` trae los mensajes por campo.
  - `409` si el email ya está registrado.

settings:
  encodeUrl: true
