info:
  name: Iniciar sesion como cliente
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/users/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "cliente@example.com",
        "password": "Customer1234!"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setVar("accessToken", res.body.data.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Inicia sesión con el cliente del seed y guarda el token en la variable `accessToken`, que el resto de la colección manda sola.

  **Auth:** no requiere.

  **Recibe**

  Body:
  - `email`
  - `password`

  **Devuelve**

  - `200` con `data.accessToken` (JWT) y `data.user` (`id`, `fullName`, `email`, `phone` y `role`).
  - `401` si el email o la contraseña son incorrectos.
