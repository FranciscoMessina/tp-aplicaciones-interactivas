info:
  name: Obtener informacion del negocio
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/business-info"
  auth:
    type: none

docs: |-
  Devuelve la información institucional del comercio, para las páginas de inicio y contacto.

  **Auth:** no requiere.

  **Recibe**

  Nada.

  **Devuelve**

  - `200` con la información (`id`, `name`, `description`, `address`, `phone`, `socialNetworks`, `openingHours`).
  - `404` si todavía no se cargó (el seed la carga).

settings:
  encodeUrl: true
