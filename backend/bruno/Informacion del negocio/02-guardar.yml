info:
  name: Guardar informacion del negocio
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/business-info"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Pixel Store",
        "description": "Tienda de tecnología con consolas, computadoras, celulares, videojuegos y accesorios. Asesoramiento personalizado y garantía oficial en todos los productos.",
        "address": "Av. Corrientes 1234, CABA, Buenos Aires",
        "phone": "+54 11 5555 0100",
        "socialNetworks": [
          "https://www.instagram.com/pixelstore",
          "https://www.facebook.com/pixelstore",
          "https://wa.me/5491155550100"
        ],
        "openingHours": [
          "Lunes a viernes de 10 a 20 hs",
          "Sábados de 10 a 14 hs"
        ]
      }
  auth: inherit

docs: |-
  Crea la información institucional, o la reemplaza si ya existe. Hay una sola en todo el sistema.

  **Auth:** administrador. Usa el token guardado al iniciar sesión como admin.

  **Recibe**

  Body, todos obligatorios:
  - `name`: nombre del comercio.
  - `description`
  - `address`
  - `phone`
  - `socialNetworks`: array de URLs (puede estar vacío).
  - `openingHours`: array de textos, por ejemplo "Lunes a viernes de 10 a 20 hs".

  **Devuelve**

  - `200` con la información (`id`, `name`, `description`, `address`, `phone`, `socialNetworks`, `openingHours`).
  - `400` si algún campo es inválido; `error.fields` trae los mensajes por campo.
  - `401` si falta el token o está vencido.
  - `403` si el usuario no es administrador.

settings:
  encodeUrl: true
