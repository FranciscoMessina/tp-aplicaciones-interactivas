info:
  name: Desactivar producto
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/products/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Id del producto, copiarlo de "Listar productos"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "isActive": false
      }
  auth: inherit

docs: |-
  Desactiva un producto: deja de aparecer en el sitio público, pero no se borra. Con `"isActive": true` se vuelve a activar. Es la misma ruta que "Actualizar producto".

  **Auth:** administrador. Usa el token guardado al iniciar sesión como admin.

  **Recibe**

  - Param `id`: id del producto, sale de "Listar productos".
  - Body `isActive`: `false` para desactivar, `true` para activar.

  **Devuelve**

  - `200` con el producto actualizado.
  - `401` si falta el token o está vencido.
  - `403` si el usuario no es administrador.
  - `404` si el producto no existe.

settings:
  encodeUrl: true
