info:
  name: Eliminar producto
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/products/:id"
  params:
    - name: id
      value: 6ab6f7514bd9c966c17cf5c2
      type: path
      description: Id del producto, copiarlo de "Listar productos"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Elimina un producto definitivamente. Para sacarlo del sitio sin perderlo, usar "Desactivar producto".

  **Auth:** administrador. Usa el token guardado al iniciar sesión como admin.

  **Recibe**

  - Param `id`: id del producto, sale de "Listar productos".

  **Devuelve**

  - `204` sin cuerpo.
  - `401` si falta el token o está vencido.
  - `403` si el usuario no es administrador.
  - `404` si el producto no existe.
