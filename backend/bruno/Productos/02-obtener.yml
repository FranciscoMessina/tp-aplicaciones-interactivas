info:
  name: Obtener producto
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/products/:id"
  params:
    - name: id
      value: 6ab6f7514bd9c966c17cf5c2
      type: path
      description: Id del producto, copiarlo de "Listar productos"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Devuelve un producto con su categoría completa, para la página de detalle.

  **Auth:** opcional. Si hay un token de administrador, cambia lo que devuelve (ver abajo).

  **Recibe**

  - Param `id`: id del producto, sale de "Listar productos".

  **Devuelve**

  - `200` con el producto (`id`, `name`, `category`, `description`, `images`, `price`, `availableQuantity`, `isActive`, `createdAt`, `updatedAt`). `category` viene como objeto.
  - `404` si no existe, o si está desactivado y no hay un token de administrador.
