opencollection: 1.0.0

info:
  name: TP APIs
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{accessToken}}"
  variables:
    - name: baseUrl
      value: http://localhost:8080

docs:
  content: |-
    # TP APIs

    Coleccion para probar los endpoints de la API.

    1. Correr `npm run seed` para cargar los datos de demostracion.
    2. Iniciar la API con `npm run dev`.
    3. Seleccionar el entorno `Local` en Bruno.
    4. Iniciar sesion con alguna de las requests de la carpeta Usuarios. El
       token se guarda solo y se manda en todas las requests siguientes.

    Los ids no se guardan: se completan a mano en los parametros o en el body
    de cada request, copiandolos de los listados.

    Usuarios del seed:

    - Administrador: `admin@example.com` / `Admin123!`
    - Cliente: `cliente@example.com` / `Customer123!`
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
