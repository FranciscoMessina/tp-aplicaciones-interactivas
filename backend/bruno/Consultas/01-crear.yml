info:
  name: Crear consulta
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/enquiries"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Tomás Herrera",
        "email": "tomas.herrera@example.com",
        "phone": "+54 11 4444 2020",
        "subject": "Consulta por Nintendo Switch 2",
        "message": "Hola, ¿la Nintendo Switch 2 viene con algún juego incluido? ¿Tienen stock para retirar esta semana?"
      }
  auth:
    type: none

docs: |-
  Envía una consulta al comercio desde el formulario de contacto. Queda guardada como `PENDING`.

  **Auth:** no requiere.

  **Recibe**

  Body:
  - `name`
  - `email`
  - `phone` (opcional)
  - `subject`
  - `message`

  **Devuelve**

  - `201` con la consulta (`id`, `name`, `email`, `phone`, `subject`, `message`, `status`, `createdAt`, `updatedAt`).
  - `400` si algún campo es inválido; `error.fields` trae los mensajes por campo.

settings:
  encodeUrl: true
